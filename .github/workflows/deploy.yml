name: Deploy server Docker image to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/deploy.yml"
      - "server.Dockerfile"
      - ".dockerignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/analyzer/**"
      - "crates/codegen/**"
      - "crates/converter/**"
      - "crates/estimator/**"
      - "crates/facade/**"
      - "crates/library/**"
      - "crates/ports/**"
      - "crates/presenter/**"
      - "crates/server/**"

env:
  IMAGE_NAME: qsimplify-server
  IMAGE_TAG: latest
  CONTAINER_NAME: qsimplify-server
  HOST_PORT: 3000
  CONTAINER_PORT: 3000

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Build Docker image
        run: |
          docker build \
            -f server.Dockerfile \
            -t $IMAGE_NAME:$IMAGE_TAG \
            ./

      - name: Save and compress Docker image
        run: |
          docker save $IMAGE_NAME:$IMAGE_TAG | gzip > $IMAGE_NAME.tar.gz

      - name: Prepare remote directory
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p ${{ secrets.REMOTE_DIRECTORY }}"

      - name: Upload Docker image to VPS
        run: |
          scp -P "${{ secrets.VPS_PORT }}" \
            $IMAGE_NAME.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.REMOTE_DIRECTORY }}/$IMAGE_NAME.tar.gz"

      - name: Deploy Docker container on VPS
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<EOF
              set -e

              cd "${{ secrets.REMOTE_DIRECTORY }}"

              gunzip -c "$IMAGE_NAME.tar.gz" | docker load
              rm "$IMAGE_NAME.tar.gz"

              docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p "$HOST_PORT:$CONTAINER_PORT" \
                "$IMAGE_NAME:$IMAGE_TAG"

              docker image prune -f
          EOF
