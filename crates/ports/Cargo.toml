[package]
name = "qctidy-ports"
description = "Ports for optional QCTidy services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["science"]

[lib]
test = false
doctest = false

[dependencies]
qctidy = { path = "../library" }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }

[features]
default = [
    "analyzer",
    "codegen-qiskit",
    "codegen-openqasm3",
    "converter-cbor",
    "converter-json",
    "converter-msgpack",
    "converter-xml",
    "estimator",
    "presenter-graphviz"
]
analyzer = []
codegen-qiskit = []
codegen-openqasm3 = []
converter-cbor = []
converter-json = []
converter-msgpack = []
converter-xml = []
estimator = []
presenter-graphviz = []

[lints]
workspace = true
