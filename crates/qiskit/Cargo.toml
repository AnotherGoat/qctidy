[package]
name = "qsimplify-qiskit"
description = "Python + Qiskit bindings for QSimplify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["science", "api-bindings"]

[lib]
name = "qsimplify_qiskit"
crate-type = ["cdylib"]
doctest = false

[dependencies]
qsimplify = { path = "../library" }
qsimplify-analyzer = { path = "../analyzer", optional = true }
qsimplify-codegen = { path = "../codegen", optional = true }
qsimplify-converter = { path = "../converter", optional = true }
qsimplify-estimator = { path = "../estimator", optional = true }
qsimplify-facade = { path = "../facade" }
qsimplify-presenter = { path = "../presenter", optional = true }
qsimplify-ports = { path = "../ports" }
faer = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"] }

[features]
default = ["analyzer", "codegen", "converter", "presenter", "estimator"]
analyzer = ["dep:qsimplify-analyzer", "qsimplify-facade/analyzer"]
codegen = ["dep:qsimplify-codegen", "qsimplify-facade/codegen"]
converter = ["dep:qsimplify-converter", "qsimplify-facade/converter"]
presenter = ["dep:qsimplify-presenter", "qsimplify-facade/presenter"]
estimator = ["dep:qsimplify-estimator", "qsimplify-facade/estimator"]

[lints]
workspace = true
