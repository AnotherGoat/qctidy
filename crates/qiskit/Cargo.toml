[package]
name = "qsimplify-qiskit"
version.workspace = true
edition.workspace = true

[lib]
name = "qsimplify_qiskit"
crate-type = ["cdylib"]
doctest = false

[dependencies]
qsimplify = { path = "../library" }
qsimplify-converter = { path = "../converter" }
qsimplify-facade = { path = "../facade" }
qsimplify-presenter = { path = "../presenter" }
qsimplify-ports = { path = "../ports" }
faer = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module"] }

[lints]
workspace = true
